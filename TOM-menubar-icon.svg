<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" role="img" aria-label="Tuetchen mit blauem Inhalt">
  <defs>
    <clipPath id="bagClip">
      <path d="M21 31 h58 v64 a9 9 0 0 1 -9 9 h-40 a9 9 0 0 1 -9 -9 z"/>
    </clipPath>
  </defs>
  <!-- Verschlusslasche oben, buendig mit dem Koerper -->
  <path d="M25 18 h50 a4 4 0 0 1 4 4 v9 h-58 v-9 a4 4 0 0 1 4 -4 z" fill="#d4dee6" stroke="#7c8b98" stroke-width="2"/>
  <!-- Tuetchen-Koerper (leicht transparentes Plastik) -->
  <path d="M21 31 h58 v64 a9 9 0 0 1 -9 9 h-40 a9 9 0 0 1 -9 -9 z" fill="#e2eef8" fill-opacity="0.55" stroke="#7c8b98" stroke-width="2"/>
  <!-- Blue Meth: fuellt das Tuetchen unten komplett, oben eine unregelmaessige Schuettkante -->
  <g clip-path="url(#bagClip)">
    <polygon points="21,66 26,61 31,65 36,58 42,63 47,59 53,64 58,57 64,62 69,58 74,63 79,60 79,104 21,104" fill="#2e7fd4"/>
    <polygon points="21,104 21,78 31,65 36,58 40,90" fill="#1b5da6"/>
    <polygon points="36,58 42,63 47,59 52,104 38,104" fill="#5aa6ee"/>
    <polygon points="53,64 58,57 64,62 68,104 55,104" fill="#1b5da6"/>
    <polygon points="69,58 74,63 79,60 79,88 71,104" fill="#5aa6ee"/>
    <polygon points="26,61 31,65 29,74 24,70" fill="#aad4f7"/>
    <polygon points="58,57 62,60 60,70 56,66" fill="#aad4f7"/>
    <polygon points="42,63 46,66 44,76 40,72" fill="#7cbdf2"/>
    <polygon points="74,63 77,66 75,75 71,71" fill="#7cbdf2"/>
    <!-- Plastikglanz -->
    <polygon points="40,31 50,31 30,104 22,104" fill="#ffffff" opacity="0.16"/>
  </g>
  <!-- Kontur ueber dem Inhalt, damit der Rand sauber bleibt -->
  <path d="M21 31 h58 v64 a9 9 0 0 1 -9 9 h-40 a9 9 0 0 1 -9 -9 z" fill="none" stroke="#7c8b98" stroke-width="2"/>
  <!-- Zip-Naht -->
  <line x1="24" y1="36" x2="76" y2="36" stroke="#7c8b98" stroke-width="1.5" stroke-dasharray="3 2.5"/>
</svg>
